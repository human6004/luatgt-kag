# Included by docker-compose.yml; operate the product through that file only.
# Empty serving/builder configuration starts with unavailable/blocked capabilities.

services:
  openspg-mysql:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-mysql@sha256:71eb546d5fc5faf70b3d8a358c022f601591b54a029b79298f2fa0302e46de9a
    platform: linux/amd64
    restart: "no"
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    environment:
      TZ: Asia/Ho_Chi_Minh
      MYSQL_DATABASE: openspg
      MYSQL_ROOT_PASSWORD: ${KAG_MYSQL_PASSWORD:?Set independent credentials in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    volumes: ["openspg-mysql-data:/var/lib/mysql"]
    networks:
      private: {aliases: [mysql]}
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql -h 127.0.0.1 -u root -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  openspg-neo4j:
    image: spg-registry.us-west-1.cr.aliyuncs.com/spg/openspg-neo4j@sha256:4bc5b7f6b83d333b1d2c8f60ac145c068d77d50bca65b3a07c927f9e2a541eb9
    platform: linux/amd64
    restart: "no"
    mem_limit: 2048m
    cpus: 1.0
    pids_limit: 256
    environment:
      TZ: Asia/Ho_Chi_Minh
      NEO4J_AUTH: neo4j/${KAG_NEO4J_PASSWORD:?Set independent credentials in .env}
      NEO4J_initial_dbms_default__database: ${KAG_DATABASE:-neo4j}
      NEO4J_server_databases_read__only: ${KAG_READ_ONLY_DATABASES:-}
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 768M
      NEO4J_server_memory_pagecache_size: 512M
    volumes: ["openspg-neo4j-data:/data", "openspg-neo4j-logs:/logs"]
    networks:
      private: {aliases: [neo4j]}
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  openspg-minio:
    image: ${COMPOSE_PROJECT_NAME:-luatgt}-openspg-minio:local
    build:
      context: ./docker/minio
    platform: linux/amd64
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KAG_MINIO_USER:-kag-minio}
      MINIO_ROOT_PASSWORD: ${KAG_MINIO_PASSWORD:?Set independent credentials in .env}
    volumes: ["openspg-minio-data:/data"]
    networks:
      private: {aliases: [minio]}

  openspg-server:
    image: ${COMPOSE_PROJECT_NAME:-luatgt}-kag:local
    working_dir: /
    user: "0:0"
    platform: linux/amd64
    restart: "no"
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 256
    environment:
      TZ: Asia/Ho_Chi_Minh
      LANG: C.UTF-8
      PYTHONPATH: /workspace
      PYTHONDONTWRITEBYTECODE: "1"
      KAG_HTTP_PROVIDER_TEST_ENABLED: ${KAG_PROVIDER_ENABLED:-0}
      KAG_HTTP_PROVIDER_TEST_GATEWAY_TOKEN_FILE: ${KAG_PROVIDER_ENABLED:+/run/secrets/egress_token}
      KAG_HTTP_PROVIDER_ALLOWED_HOSTS_FILE: /run/provider-hosts.lst
      KAG_HTTP_PROVIDER_PROXY_BASE_URL: ${KAG_PROVIDER_PROXY_BASE_URL:-}
      KAG_HTTP_CHAT_PROXY_TEST_SAFE: ${KAG_CHAT_PROXY_TEST_SAFE:-0}
      KAG_HTTP_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES: ${KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES:-0}
      KAG_HTTP_CHAT_PROXY_PORT: ${KAG_CHAT_PROXY_PORT:-8317}
      KAG_BROKER_HOST: 0.0.0.0
      KAG_BROKER_PORT: "8899"
      KAG_BROKER_DATABASE: vietroadtraffic
      KAG_BROKER_NEO4J_ENDPOINT: http://openspg-neo4j:7474
      KAG_BROKER_USERNAME: neo4j
      KAG_BROKER_PASSWORD_FILE: /run/broker-credentials/neo4j.password
      KAG_BROKER_TOKEN_FILE: /run/broker-credentials/broker.token
      KAG_BROKER_DATABASE_ID: ${KAG_BROKER_DATABASE_ID:-}
      KAG_BROKER_SERVER_ID: ${KAG_BROKER_SERVER_ID:-}
    entrypoint: ["/bin/sh", "/workspace/docker/openspg-server.sh"]
    command:
      - -Dfile.encoding=UTF-8
      - -Xms256m
      - -Xmx768m
      - -jar
      - arks-sofaboot-0.0.1-SNAPSHOT-executable.jar
      - --server.address=0.0.0.0
      - --server.repository.impl.jdbc.host=openspg-mysql
      - --server.repository.impl.jdbc.password=${KAG_MYSQL_PASSWORD:?Set independent credentials in .env}
      - --builder.model.execute.num=1
      # Pemja uses the pinned base interpreter/library with product dependencies first.
      - --python.paths=/workspace;/opt/kag-venv/lib/python3.10/site-packages
      # Pemja INFO logs contain full model configuration, including the provider key.
      - --logging.level.com.antgroup.openspg.common.util.pemja.PemjaUtils=OFF
      - --cloudext.graphstore.url=neo4j://openspg-neo4j:7687?user=neo4j&password=${KAG_NEO4J_PASSWORD:?Set independent credentials in .env}&database=${KAG_DATABASE:-neo4j}
      - --cloudext.searchengine.url=neo4j://openspg-neo4j:7687?user=neo4j&password=${KAG_NEO4J_PASSWORD:?Set independent credentials in .env}&database=${KAG_DATABASE:-neo4j}
    networks:
      private: {aliases: [server]}
      readbus: {}
    secrets: [egress_token]
    volumes:
      - type: bind
        source: ${KAG_PROVIDER_HOSTS_FILE:-./docker/kag-ingress/provider-hosts.lst}
        target: /run/provider-hosts.lst
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KAG_STATE_DIR:-../luatgt-state}/broker-credentials
        target: /run/broker-credentials
        read_only: true
        bind: {create_host_path: true}
    depends_on:
      kag-api: {condition: service_healthy}
      openspg-mysql: {condition: service_healthy}
      openspg-neo4j: {condition: service_healthy}
      openspg-minio: {condition: service_started}

  kag-api:
    image: ${COMPOSE_PROJECT_NAME:-luatgt}-kag:local
    build:
      context: .
      dockerfile: docker/kag-api/Dockerfile
    platform: linux/amd64
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 40s
    init: true
    environment:
      KAG_HTTP_HOST: 0.0.0.0
      KAG_HTTP_PORT: "8000"
      KAG_HTTP_WORKERS: "1"
      KAG_CHAT_TRACE_QUESTION: ${KAG_CHAT_TRACE_QUESTION:-}
      KAG_QUERY_TIMEOUT_SECONDS: ${KAG_QUERY_TIMEOUT_SECONDS:-180}
      KAG_HTTP_QUERY_SECRET_FILE: /run/secrets/query_token
      KAG_HTTP_INSPECT_SECRET_FILE: /run/secrets/inspect_token
      KAG_HTTP_CREDENTIALS_WRITE_SECRET_FILE: /run/secrets/credentials_write_token
      KAG_HTTP_PROVIDER_TEST_SECRET_FILE: /run/secrets/provider_test_token
      KAG_HTTP_CONFIG_APPLY_SECRET_FILE: /run/secrets/config_apply_token
      KAG_HTTP_PROVIDER_TEST_ENABLED: ${KAG_PROVIDER_ENABLED:-0}
      KAG_HTTP_PROVIDER_TEST_GATEWAY_TOKEN_FILE: ${KAG_PROVIDER_ENABLED:+/run/secrets/egress_token}
      KAG_HTTP_PROVIDER_ALLOWED_HOSTS_FILE: /run/provider-hosts.lst
      KAG_HTTP_PROVIDER_PROXY_BASE_URL: ${KAG_PROVIDER_PROXY_BASE_URL:-}
      # Enable only for a proxy route with retries, credential rotation and model fallback disabled.
      KAG_HTTP_CHAT_PROXY_TEST_SAFE: ${KAG_CHAT_PROXY_TEST_SAFE:-0}
      KAG_HTTP_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES: ${KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES:-0}
      KAG_HTTP_CHAT_PROXY_PORT: ${KAG_CHAT_PROXY_PORT:-8317}
      KAG_HTTP_RELEASE_ROOT: ${KAG_RELEASE_ID:+/release}
      KAG_HTTP_RELEASE_ID: ${KAG_RELEASE_ID:-}
      KAG_HTTP_SAMPLE_PROOF_SHA256: ${KAG_SAMPLE_PROOF_SHA256:-}
      KAG_HTTP_SAMPLE_PROOF_SHA256_FILE: ${KAG_BROKER_URL:+/run/api-credentials/sample-proof.sha256}
      # Optional read-only datasets under the existing external release mount.
      KAG_HTTP_EVALUATION_ROOT: ${KAG_EVALUATION_ENABLED:+/release/evaluation}
      KAG_HTTP_READER_USERNAME: ${KAG_READER_USERNAME:-}
      KAG_HTTP_READER_PASSWORD_FILE: ${KAG_READER_USERNAME:+/run/api-credentials/reader.password}
      KAG_HTTP_BROKER_URL: ${KAG_BROKER_URL:-}
      KAG_HTTP_BROKER_TOKEN_FILE: ${KAG_BROKER_URL:+/run/api-credentials/broker.token}
      KAG_HTTP_EMBEDDING_URL: ${KAG_EMBEDDING_URL:-}
      KAG_HTTP_EMBEDDING_MODEL: ${KAG_EMBEDDING_MODEL:-}
      KAG_HTTP_EMBEDDING_KEY_FILE: ${KAG_EMBEDDING_MODEL:+/run/api-credentials/embedding.key}
      KAG_HTTP_CHAT_URL: ${KAG_CHAT_URL:-}
      KAG_HTTP_CHAT_MODEL: ${KAG_CHAT_MODEL:-}
      KAG_HTTP_CHAT_KEY_FILE: ${KAG_CHAT_MODEL:+/run/api-credentials/chat.key}
      KAG_HTTP_QUERY_PROOF_SHA256_FILE: ${KAG_QUERY_PROFILE:+/run/api-credentials/query-proof.sha256}
      KAG_HTTP_PROVIDER_GATEWAY: ${KAG_QUERY_PROFILE:+http://kag-ingress:8898/v1}
      KAG_HTTP_PROVIDER_GATEWAY_TOKEN_FILE: ${KAG_QUERY_PROFILE:+/run/secrets/egress_token}
      KAG_HTTP_ATTEMPT_LEDGER: ${KAG_QUERY_PROFILE:+/provider-state/attempts.json}
      KAG_OPERATIONAL_PROOF: DENY
      KAG_PRODUCTION_WRITE: BLOCKED
      KAG_PROVIDER_EGRESS: DENY
      KAG_DEBUG_DUMP_CONFIG: "0"
    secrets: [query_token, inspect_token, egress_token, credentials_write_token, provider_test_token, config_apply_token]
    volumes:
      - type: bind
        source: ${KAG_PROVIDER_HOSTS_FILE:-./docker/kag-ingress/provider-hosts.lst}
        target: /run/provider-hosts.lst
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KAG_STATE_DIR:-../luatgt-state}/release
        target: /release
        read_only: true
        bind: {create_host_path: true}
      - type: bind
        source: ${KAG_STATE_DIR:-../luatgt-state}/api-credentials
        target: /run/api-credentials
        read_only: true
        bind: {create_host_path: true}
      - type: volume
        source: kag-provider-state
        target: /provider-state
      - type: volume
        source: kag-builder-state
        target: /builder-state
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /run/kag-locks:rw,noexec,nosuid,size=1m,mode=0700,uid=10001,gid=10001
    networks: [readbus]
    healthcheck:
      # Liveness does not assert graph or provider readiness.
      test: ["CMD", "python", "-B", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/v1/health',timeout=2); assert r.status==200"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  # Idle control process; Runner starts only after an authenticated ADMIN request.
  kag-builder:
    image: ${COMPOSE_PROJECT_NAME:-luatgt}-kag:local
    platform: linux/amd64
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 128
    init: true
    stop_grace_period: 120s
    entrypoint: [python, -B, -m, kag.builder.control]
    environment:
      KAG_GRAPH_LOCK_VOLUME: ${KAG_GRAPH_LOCK_VOLUME:-${COMPOSE_PROJECT_NAME:-luatgt}_kag-builder-graph-locks}
      KAG_BUILDER_CONFIG: /builder-input/runner.json
      KAG_QUERY_TIMEOUT_SECONDS: ${KAG_QUERY_TIMEOUT_SECONDS:-180}
      KAG_BUILDER_STATE_DIR: /builder-state
      KAG_BUILDER_RUN_ROOT: /builder-runs
      KAG_BUILDER_TOKEN_FILE: /run/secrets/builder_token
      KAG_HTTP_INSPECT_SECRET_FILE: /run/secrets/inspect_token
      KAG_HTTP_CONFIG_APPLY_SECRET_FILE: /run/secrets/config_apply_token
      KAG_BUILDER_PROJECT_ID: ${KAG_BUILDER_PROJECT_ID:-}
      KAG_BUILDER_PROJECT_NAME: ${KAG_BUILDER_PROJECT_NAME:-}
      KAG_BUILDER_DATABASE: ${KAG_BUILDER_DATABASE:-}
      KAG_BUILDER_OPENSPG_URL: ${KAG_BUILDER_OPENSPG_URL:-http://openspg-server:8887}
      KAG_BUILDER_NEO4J_HTTP: ${KAG_BUILDER_NEO4J_HTTP:-http://openspg-neo4j:7474}
      KAG_BUILDER_NEO4J_URI: ${KAG_BUILDER_NEO4J_URI:-bolt://openspg-neo4j:7687}
      KAG_BUILDER_SERVING_DATABASE: ${KAG_DATABASE:-neo4j}
      KAG_BUILDER_CLEAR_TARGETS: ${KAG_BUILDER_CLEAR_TARGETS:-[]}
      KAG_HTTP_RELEASE_ID: ${KAG_RELEASE_ID:-}
      KAG_HTTP_RELEASE_ROOT: ${KAG_RELEASE_ID:+/release}
      KAG_OPENSPG_PUBLIC_URL: ${KAG_OPENSPG_PUBLIC_URL:-http://127.0.0.1:8887/}
      KAG_NEO4J_BROWSER_URL: ${KAG_NEO4J_BROWSER_URL:-http://127.0.0.1:7474/browser/}
      KAG_NEO4J_PUBLIC_BOLT_URL: ${KAG_NEO4J_PUBLIC_BOLT_URL:-bolt://127.0.0.1:7687}
      KAG_HTTP_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES: ${KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES:-0}
      KAG_HTTP_PROVIDER_TEST_ENABLED: ${KAG_PROVIDER_ENABLED:-0}
      KAG_HTTP_PROVIDER_TEST_GATEWAY_TOKEN_FILE: ${KAG_PROVIDER_ENABLED:+/run/secrets/egress_token}
      KAG_HTTP_PROVIDER_ALLOWED_HOSTS_FILE: /run/provider-hosts.lst
      KAG_HTTP_PROVIDER_PROXY_BASE_URL: ${KAG_PROVIDER_PROXY_BASE_URL:-}
      KAG_HTTP_CHAT_PROXY_TEST_SAFE: ${KAG_CHAT_PROXY_TEST_SAFE:-0}
      KAG_HTTP_CHAT_PROXY_PORT: ${KAG_CHAT_PROXY_PORT:-8317}
      KAG_NEO4J_USERNAME: neo4j
      KAG_NEO4J_PASSWORD: ${KAG_NEO4J_PASSWORD:?Set independent credentials in .env}
      # Runner config, target identity and GraphLock enforce Worker write admission.
      KAG_DEBUG_DUMP_CONFIG: "0"
    volumes:
      - type: volume
        source: kag-builder-state
        target: /builder-state
      - type: bind
        source: ${KAG_STATE_DIR:-../luatgt-state}/release
        target: /release
        read_only: true
        bind: {create_host_path: true}
      - type: volume
        source: kag-provider-state
        target: /provider-state
      - type: bind
        source: ${KAG_PROVIDER_HOSTS_FILE:-./docker/kag-ingress/provider-hosts.lst}
        target: /run/provider-hosts.lst
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${KAG_STATE_DIR:-../luatgt-state}/builder-input
        target: /builder-input
        read_only: true
        bind: {create_host_path: true}
      - type: volume
        source: kag-builder-runs
        target: /builder-runs
      - type: volume
        source: kag-builder-graph-locks
        target: /run/kag-locks
    tmpfs: ["/tmp:rw,noexec,nosuid,size=512m,mode=1777"]
    secrets: [builder_token, egress_token, inspect_token, config_apply_token]
    network_mode: service:openspg-server
    depends_on:
      openspg-server: {condition: service_started, restart: true}
      openspg-neo4j: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-B", "-c", "from pathlib import Path; import urllib.request; t=Path('/run/secrets/builder_token').read_text().strip(); r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8010/v1/builder/status',headers={'Authorization':'Bearer '+t}),timeout=2); assert r.status==200"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  kag-ingress:
    image: haproxy@sha256:168a5e3984df24054946c94fb7d29d785c7ed1af8ce11ea4b33253221c8c85c8
    platform: linux/amd64
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    # Internal-only storage networks cannot publish host ports directly.
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:8887:8887"
    init: true
    stop_grace_period: 10s
    depends_on:
      kag-api: {condition: service_healthy}
    entrypoint: [haproxy]
    command: [-W, -db, -f, /usr/local/etc/haproxy/haproxy.cfg]
    sysctls:
      net.ipv4.ip_forward: "0"
    environment:
      KAG_PROVIDER_ENABLED: ${KAG_PROVIDER_ENABLED:-0}
      KAG_PROVIDER_PROXY_BASE_URL: ${KAG_PROVIDER_PROXY_BASE_URL:-}
      KAG_CHAT_PROXY_TEST_SAFE: ${KAG_CHAT_PROXY_TEST_SAFE:-0}
      KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES: ${KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES:-0}
      KAG_CHAT_PROXY_HOST: ${KAG_CHAT_PROXY_HOST:-host.docker.internal}
      KAG_QUERY_TIMEOUT_SECONDS: ${KAG_QUERY_TIMEOUT_SECONDS:-180}
      KAG_CHAT_PROXY_PORT: ${KAG_CHAT_PROXY_PORT:-8317}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - type: bind
        source: ${KAG_PROVIDER_HOSTS_FILE:-./docker/kag-ingress/provider-hosts.lst}
        target: /run/provider-hosts.lst
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./docker/kag-ingress/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - source: egress_token
        target: /run/egress-credentials/egress.token
    networks: [readbus, ingress, private]

networks:
  private:
    internal: true
  readbus:
    internal: true
  ingress:
    internal: false
volumes:
  kag-builder-state:
  kag-builder-graph-locks:
    name: ${KAG_GRAPH_LOCK_VOLUME:-${COMPOSE_PROJECT_NAME:-luatgt}_kag-builder-graph-locks}
  kag-builder-runs:
  kag-provider-state:
  openspg-mysql-data:
    name: ${KAG_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_openspg-mysql-data
    external: ${KAG_STORAGE_EXTERNAL:-false}
  openspg-neo4j-data:
    name: ${KAG_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_openspg-neo4j-data${KAG_NEO4J_STORAGE_REVISION:-}
    external: ${KAG_STORAGE_EXTERNAL:-false}
  openspg-neo4j-logs:
    name: ${KAG_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_openspg-neo4j-logs
    external: ${KAG_STORAGE_EXTERNAL:-false}
  openspg-minio-data:
    name: ${KAG_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_openspg-minio-data
    external: ${KAG_STORAGE_EXTERNAL:-false}
secrets:
  provider_test_token: {file: "${KAG_PROVIDER_TEST_SECRET_FILE:-../luatgt-state/provider-test.token}"}
  config_apply_token: {file: "${KAG_CONFIG_APPLY_SECRET_FILE:-../luatgt-state/config-apply.token}"}
  credentials_write_token: {file: "${KAG_CREDENTIALS_WRITE_SECRET_FILE:-../luatgt-state/credentials-write.token}"}
  builder_token: {file: "${KAG_STATE_DIR:-../luatgt-state}/builder.token"}
  query_token: {file: "${KAG_STATE_DIR:-../luatgt-state}/query.token"}
  inspect_token: {file: "${KAG_STATE_DIR:-../luatgt-state}/inspect.token"}
  egress_token: {file: "${KAG_STATE_DIR:-../luatgt-state}/egress.token"}
