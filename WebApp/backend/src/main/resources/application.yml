spring:
  mvc.async.request-timeout: ${KAG_QUERY_TIMEOUT_SECONDS:180}s
  jackson.deserialization.fail-on-unknown-properties: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/luatgt?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:luatgt}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties:
      hibernate.type.preferred_uuid_jdbc_type: BINARY
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
      hibernate.jdbc.time_zone: UTC
  data.redis:
    url: ${REDIS_URL:redis://localhost:6379}
    repositories.enabled: false
  servlet.multipart:
    max-file-size: 20MB
    max-request-size: 21MB
server:
  port: 8080
  error.include-message: never
  tomcat.max-part-count: 5
app:
  jwt-secret: ${JWT_SECRET}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  kag-url: ${KAG_BASE_URL:http://127.0.0.1:38000}
  kag-token-file: ${KAG_TOKEN_FILE:}
  kag-inspect-token-file: ${KAG_INSPECT_TOKEN_FILE:}
  kag-credentials-write-token-file: ${KAG_CREDENTIALS_WRITE_TOKEN_FILE:}
  kag-provider-test-token-file: ${KAG_PROVIDER_TEST_TOKEN_FILE:}
  kag-config-apply-token-file: ${KAG_CONFIG_APPLY_TOKEN_FILE:}
  kag-builder-url: ${KAG_BUILDER_URL:}
  kag-builder-token-file: ${KAG_BUILDER_TOKEN_FILE:}
  kag-release-id: ${KAG_RELEASE_ID:}
  kag-webapp-snapshot-id: ${KAG_WEBAPP_SNAPSHOT_ID:}
  kag-query-timeout-seconds: ${KAG_QUERY_TIMEOUT_SECONDS:180}
  kag-inspection-timeout-seconds: ${KAG_INSPECTION_TIMEOUT_SECONDS:2}
  minio-url: ${MINIO_URL:http://localhost:9000}
  minio-user: ${MINIO_USER}
  minio-password: ${MINIO_PASSWORD}
  bucket: luatgt
management.endpoints.web.exposure.include: health
