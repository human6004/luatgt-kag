name: ${COMPOSE_PROJECT_NAME:-luatgt}

# One product project; the included file is a service fragment, not another stack.
include: [docker-compose.kag.yml]

services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: luatgt
      MYSQL_USER: luatgt
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set credentials in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set credentials in .env}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_bin", "--default-time-zone=+00:00"]
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes: ["kag-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u luatgt luatgt -e 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
  redis:
    image: redis:7.4-bookworm
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set credentials in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set credentials in .env}
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    build:
      context: ./docker/minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-luatgt-local}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Set credentials in .env}
    ports: ["127.0.0.1:${MINIO_PORT:-9000}:9000", "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"]
    volumes: ["minio-data:/data"]
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    environment:
      DB_URL: jdbc:mysql://mysql:3306/luatgt?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: luatgt
      DB_PASSWORD: ${DB_PASSWORD:?Set credentials in .env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set credentials in .env}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set credentials in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@luatgt.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set credentials in .env}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_USER:-luatgt-local}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?Set credentials in .env}
      KAG_BASE_URL: http://kag-api:8000
      KAG_TOKEN_FILE: /run/secrets/kag_query_token
      KAG_INSPECT_TOKEN_FILE: /run/secrets/kag_inspect_token
      KAG_CREDENTIALS_WRITE_TOKEN_FILE: /run/secrets/credentials_write_token
      KAG_PROVIDER_TEST_TOKEN_FILE: /run/secrets/provider_test_token
      KAG_CONFIG_APPLY_TOKEN_FILE: /run/secrets/config_apply_token
      KAG_BUILDER_URL: http://openspg-server:8010
      KAG_BUILDER_TOKEN_FILE: /run/secrets/builder_token
      KAG_RELEASE_ID: ${KAG_RELEASE_ID:-}
      KAG_WEBAPP_SNAPSHOT_ID: ${KAG_WEBAPP_SNAPSHOT_ID:-}
      KAG_QUERY_TIMEOUT_SECONDS: ${KAG_QUERY_TIMEOUT_SECONDS:-180}
      KAG_INSPECTION_TIMEOUT_SECONDS: ${KAG_INSPECTION_TIMEOUT_SECONDS:-2}
      TZ: Asia/Ho_Chi_Minh
    secrets: [kag_query_token, kag_inspect_token, builder_token, credentials_write_token, provider_test_token, config_apply_token]
    networks: [default, readbus]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_started}
      kag-api: {condition: service_healthy}
      kag-builder: {condition: service_healthy}
  frontend:
    build:
      context: ./WebApp/frontend
      dockerfile: ../../docker/frontend/Dockerfile
    ports: ["127.0.0.1:${WEBAPP_PORT:-8081}:80"]
    depends_on: [backend]
volumes:
  kag-data:
    name: ${WEBAPP_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_kag-data
    external: ${WEBAPP_STORAGE_EXTERNAL:-false}
  redis-data:
    name: ${WEBAPP_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_redis-data
    external: ${WEBAPP_STORAGE_EXTERNAL:-false}
  minio-data:
    name: ${WEBAPP_STORAGE_PROJECT:-${COMPOSE_PROJECT_NAME:-luatgt}}_minio-data
    external: ${WEBAPP_STORAGE_EXTERNAL:-false}
secrets:
  kag_query_token:
    file: ${KAG_STATE_DIR:-../luatgt-state}/query.token
  kag_inspect_token:
    file: ${KAG_STATE_DIR:-../luatgt-state}/inspect.token
