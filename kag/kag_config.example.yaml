# Usage (from kag/):
# 1. Copy kag_config.example.yaml to kag_config.yaml.
# 2. Fill openie_llm, chat_llm, vectorize_model and project id/namespace/language.
# 3. Set the three VIETROAD_*_API_KEY environment variables locally.
# 4. Never commit kag_config.yaml. Do not instantiate placeholders.
# Run from kag/ (native discovery) or pass an explicit config_file.
# Provider fields below match pinned OpenAI-compatible/Ollama adapters.
# For another registered adapter, adjust fields to its constructor.
# With Ollama, remove/comment api_key; local models need no API key.

#------------project configuration start----------------#
# Reserved for upstream OpenIE/path-selection components; not graph extraction.
openie_llm: &openie_llm
  type: <LLM_PROVIDER>
  base_url: <OPENIE_LLM_BASE_URL>
  api_key: !ENV VIETROAD_OPENIE_LLM_API_KEY
  model: <OPENIE_LLM_MODEL>
  enable_check: false
  timeout: 120

# Reserved for solver/planner/reasoning/generator components.
chat_llm: &chat_llm
  type: <LLM_PROVIDER>
  base_url: <CHAT_LLM_BASE_URL>
  api_key: !ENV VIETROAD_CHAT_LLM_API_KEY
  model: <CHAT_LLM_MODEL>
  enable_check: false
  timeout: 120

# Shared embedding model for Builder and Retrieval.
# Fill vector_dimensions with a native positive integer measured by a mini probe.
# Pinned embedding adapters have no effective enable_check switch.
vectorize_model: &vectorize_model
  type: <EMBEDDING_PROVIDER>
  base_url: <EMBEDDING_BASE_URL>
  api_key: !ENV VIETROAD_EMBEDDING_API_KEY
  model: <EMBEDDING_MODEL>
  vector_dimensions: <VECTOR_DIMENSIONS>
  timeout: 60
# Upstream compatibility alias: model config, not a BatchVectorizer component.
vectorizer: *vectorize_model

log:
  level: INFO

project:
  biz_scene: legal
  host_addr: http://127.0.0.1:28887
  id: <OPENSPG_PROJECT_ID>
  # Vietnamese prompt/runtime support is not established at this pin.
  language: <PROJECT_LANGUAGE>
  namespace: <OPENSPG_NAMESPACE>
#------------project configuration end----------------#

#------------builder configuration start----------------#
# Structured-first: deterministic mapping -> graph plan -> vectors -> native
# Integer writer -> OpenSPG. Keep name=id; do not use SchemaFreeExtractor/OpenIE.
# Graph structure: kag/builder/graph_plan.py; writer: kag/builder/writer_adapter.py.
# Không bật block này trước khi chain/scanner hợp lệ.
# Synchronous intent: 2 record slots x 2 per-chain workers, about 4 component tasks.
# kag_builder_pipeline:
#   chain:
#     ...
#   num_threads_per_chain: 2
#   num_chains: 2
#   scanner:
#     ...
# max_concurrency controls the async runner only; leave it unset for sync.
#
# Reusable upstream block (medicine config and riskmining Builder use this key).
chain_vectorizer:
  type: batch_vectorizer
  vectorize_model: *vectorize_model
  batch_size: 4
  # Short labels before vectorization; qualification belongs to the writer.
  disable_generation:
    - LegalDocument.name
    - LegalUnit.name
    - TrafficSign.name
    - Entity.name
# Explicit schema-indexed content only:
# LegalDocument.title, LegalUnit.text, TrafficSign.ten, TrafficSign.moTa.
# These targets remain in the schema contract; no schema change here.
# Project-local ResilientVectorizer consumes this block; upstream KAG ignores it.
# Only exhausted LegalUnit.text uses embedding-only chunks. Source text is immutable.
embedding_fallback:
  enabled: true
  max_chunk_chars: 8000
  overlap_chars: 500
  min_chunk_chars: 1000
  max_split_depth: 3
#------------builder configuration end----------------#

#------------solver configuration start----------------#
search_api: &search_api
  type: openspg_search_api

graph_api: &graph_api
  type: openspg_graph_api

# Final KAG components can reuse *openie_llm, *chat_llm, *vectorize_model,
# *search_api and *graph_api. No retriever/planner/executor/generator is wired.
#------------solver configuration end----------------#
