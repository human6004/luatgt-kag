global
    maxconn 32
    nbthread 1

defaults
    mode http
    retries 0
    timeout connect 5s
    timeout client 180s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 5s

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

# Only these native admin protocols are published, bound to host loopback by Compose.
listen admin_openspg
    mode tcp
    bind :8887
    server openspg openspg-server:8887 resolvers docker init-addr libc,none

listen admin_neo4j_http
    mode tcp
    bind :7474
    server neo4j openspg-neo4j:7474 resolvers docker init-addr libc,none

listen admin_neo4j_bolt
    mode tcp
    bind :7687
    timeout client 1h
    timeout server 1h
    server neo4j openspg-neo4j:7687 resolvers docker init-addr libc,none

# Docker DNS identifies API/Worker namespaces; the provider port is not published.
frontend sample_provider
    bind :8898
    http-request do-resolve(txn.api_ip,docker,ipv4) str(kag-api)
    http-request set-var-fmt(txn.api_address) "%[var(txn.api_ip)]"
    http-request do-resolve(txn.builder_ip,docker,ipv4) str(openspg-server)
    http-request set-var-fmt(txn.builder_address) "%[var(txn.builder_ip)]"
    acl provider_source src,strcmp(txn.api_address) eq 0
    acl provider_source src,strcmp(txn.builder_address) eq 0
    acl provider_enabled env(KAG_PROVIDER_ENABLED) -m str 1
    acl gateway_token req.hdr(X-KAG-Provider-Token) -m str -f /run/egress-credentials/egress.token
    acl chat_path path -m str /v1/chat/completions
    acl embed_path path -m str /v1/embeddings
    acl models_path path -m str /v1/models
    http-request deny deny_status 403 unless provider_enabled provider_source gateway_token
    http-request deny deny_status 400 if { url_reg -i ^https?:// } or { query -m found }
    http-request deny deny_status 405 if { method CONNECT }
    http-request deny deny_status 404 unless chat_path or embed_path or models_path
    http-request deny deny_status 405 if models_path !{ method GET }
    http-request deny deny_status 405 if !models_path !{ method POST }
    http-request del-header X-KAG-Provider-Token
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    acl dynamic req.hdr(X-KAG-Provider-Route) -m found
    acl public_route req.hdr(X-KAG-Provider-Route) -m str public
    acl proxy_route req.hdr(X-KAG-Provider-Route) -m str proxy
    acl allowed_host req.hdr(X-KAG-Provider-Host) -m str -f /run/provider-hosts.lst
    acl proxy_registered env(KAG_PROVIDER_PROXY_BASE_URL) -m found
    acl proxy_safe env(KAG_CHAT_PROXY_TEST_SAFE) -m str 1
    acl proxy_retries_accepted env(KAG_CHAT_PROXY_ALLOW_UPSTREAM_RETRIES) -m str 1
    http-request set-var(txn.proxy_base) env(KAG_PROVIDER_PROXY_BASE_URL)
    acl proxy_base req.hdr(X-KAG-Provider-Base),strcmp(txn.proxy_base) eq 0
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if dynamic !public_route !proxy_route
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if dynamic models_path
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if public_route !allowed_host
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if proxy_route !proxy_registered
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if proxy_route !proxy_safe !proxy_retries_accepted
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if proxy_route !proxy_base
    http-request deny deny_status 400 if dynamic !{ req.hdr_cnt(X-KAG-Provider-Route) eq 1 }
    http-request deny deny_status 400 if dynamic !{ req.hdr_cnt(X-KAG-Provider-Host) eq 1 }
    http-request deny deny_status 400 if dynamic !{ req.hdr_cnt(X-KAG-Provider-Path) eq 1 }
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if dynamic chat_path !{ req.hdr(X-KAG-Provider-Path) -m reg ^(/[A-Za-z0-9_-]+)*/chat/completions$ }
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if dynamic embed_path !{ req.hdr(X-KAG-Provider-Path) -m reg ^(/[A-Za-z0-9_-]+)*/embeddings$ }
    http-request set-var(txn.provider_host) req.hdr(X-KAG-Provider-Host) if dynamic
    http-request set-var(txn.provider_route) req.hdr(X-KAG-Provider-Route) if dynamic
    http-request set-var(txn.provider_path) req.hdr(X-KAG-Provider-Path) if dynamic
    http-request del-header X-KAG-Provider-Route
    http-request del-header X-KAG-Provider-Host
    http-request del-header X-KAG-Provider-Path
    http-request del-header X-KAG-Provider-Base
    use_backend provider_public if { var(txn.provider_route) -m str public }
    use_backend provider_proxy if { var(txn.provider_route) -m str proxy }
    use_backend sample_embedding if embed_path
    default_backend sample_chat

backend provider_public
    option http-server-close
    http-reuse never
    http-request do-resolve(txn.provider_ip,docker,ipv4) var(txn.provider_host)
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 unless { var(txn.provider_ip) -m found }
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if { var(txn.provider_ip) -m ip 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 }
    http-request set-dst var(txn.provider_ip)
    http-request set-dst-port int(443)
    http-request set-header Host %[var(txn.provider_host)]
    http-request set-path %[var(txn.provider_path)]
    server provider 0.0.0.0:0 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt sni req.hdr(Host)

backend provider_proxy
    http-request set-path %[var(txn.provider_path)]
    http-request set-header Host "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"
    server operator "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"

backend sample_chat
    timeout server 60s
    http-request set-header Host "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"
    server operator "${KAG_CHAT_PROXY_HOST}:${KAG_CHAT_PROXY_PORT}"

backend sample_embedding
    timeout server 60s
    http-request do-resolve(txn.embedding_ip,docker,ipv4) str(api.vilao.ai)
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 unless { var(txn.embedding_ip) -m found }
    http-request deny deny_status 403 hdr X-KAG-Provider-Blocked 1 if { var(txn.embedding_ip) -m ip 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/3 }
    http-request set-dst var(txn.embedding_ip)
    http-request set-dst-port int(443)
    http-request set-header Host api.vilao.ai
    server embedding 0.0.0.0:0 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost api.vilao.ai sni str(api.vilao.ai)
